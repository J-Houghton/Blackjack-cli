name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x   # match <TargetFramework> in blackjack.csproj

      - name: Test
        run: dotnet test blackjack.Tests/blackjack.Tests.csproj -c Release

      - name: Publish
        run: >
          dotnet publish blackjack/blackjack.csproj
          -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -o publish

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "v1.0.${{ github.run_number }}"
          publish/blackjack.exe
          --target "${{ github.sha }}"
          --generate-notes
